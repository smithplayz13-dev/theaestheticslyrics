<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:"
    />
    <title>theaestheticslyrics</title>
  </head>
  <body>
    <div id="stage-bg" class="stage-bg" aria-hidden="true">
      <div id="stage-bg-a" class="stage-bg-layer active"></div>
      <div id="stage-bg-b" class="stage-bg-layer"></div>
    </div>
    <div id="stage"></div>
    <button class="ambient-mode-toggle btn-ambient-enter" id="ambient-enter-btn" type="button" aria-label="Enter Ambient Mode" title="Ambient Mode (A)">
      <svg viewBox="0 0 24 24" class="control-icon" fill="currentColor">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
    <div id="ambient-view" class="ambient-view" aria-hidden="true">
      <div class="ambient-header">
        <button class="ambient-mode-toggle btn-ambient-exit" id="ambient-exit-btn" type="button" aria-label="Exit Ambient Mode" title="Exit Ambient Mode (Esc)">
          <svg viewBox="0 0 24 24" class="control-icon" fill="currentColor">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z"/>
          </svg>
          <span class="ambient-exit-badge">Esc</span>
        </button>
      </div>

      <div class="ambient-content">
        <div class="ambient-left" id="ambient-left"></div>

        <div class="ambient-right" id="ambient-right">
          <div class="ambient-card" id="ambient-card">
            <div class="ambient-glow" id="ambient-glow">
              <img class="ambient-glow-img" id="ambient-glow-img" alt="" />
            </div>
            <img class="ambient-img" id="ambient-img" alt="" />
          </div>
          <div class="ambient-meta" id="ambient-meta">
            <div class="ambient-title" id="ambient-title"></div>
            <div class="ambient-artist" id="ambient-artist"></div>
          </div>
        </div>
      </div>

      <div class="ambient-bottom" id="ambient-bottom">
        <div class="ambient-progress" id="ambient-progress">
          <span class="ambient-time" id="ambient-time-cur">0:00</span>
          <div class="ambient-track-bar" id="ambient-track-bar" role="slider" aria-label="Playback progress" tabindex="0">
            <div class="ambient-track-fill" id="ambient-track-fill"></div>
            <div class="ambient-track-thumb" id="ambient-track-thumb"></div>
          </div>
          <span class="ambient-time" id="ambient-time-total">0:00</span>
        </div>
        <div class="ambient-controls" id="ambient-controls">
          <button class="ambient-btn btn-prev" id="ambient-btn-prev" type="button" aria-label="Previous track" title="Previous track">
            <svg viewBox="0 0 24 24" class="control-icon" fill="currentColor">
              <path d="M6 5a1 1 0 0 1 1 1v12a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1zm11.2 1.35a1 1 0 0 1 1.6.8v9.7a1 1 0 0 1-1.6.8L9.6 13.05a1 1 0 0 1 0-1.7l7.6-4.8z"/>
            </svg>
          </button>
          <button class="ambient-btn btn-play-pause" id="ambient-btn-play-pause" type="button" aria-label="Play or pause" title="Play / Pause" data-playing="false">
            <svg viewBox="0 0 24 24" class="control-icon icon-play" fill="currentColor">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
            </svg>
            <svg viewBox="0 0 24 24" class="control-icon icon-pause" fill="currentColor">
              <path d="M6 5a2 2 0 0 1 2 2v10a2 2 0 1 1-4 0V7a2 2 0 0 1 2-2zm12 0a2 2 0 0 1 2 2v10a2 2 0 1 1-4 0V7a2 2 0 0 1 2-2z"/>
            </svg>
          </button>
          <button class="ambient-btn btn-next" id="ambient-btn-next" type="button" aria-label="Next track" title="Next track">
            <svg viewBox="0 0 24 24" class="control-icon" fill="currentColor">
              <path d="M18 5a1 1 0 0 1 1 1v12a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1zM6.8 6.35a1 1 0 0 0-1.6.8v9.7a1 1 0 0 0 1.6.8l7.6-4.6a1 1 0 0 0 0-1.7l-7.6-5z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/stage/main.ts"></script>
  </body>
</html>
